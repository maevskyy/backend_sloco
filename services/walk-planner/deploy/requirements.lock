# Runtime dependencies of the walk-planner image (deploy/Dockerfile) -- hash-pinned, complete closure.
#
# Target: CPython 3.12 on Linux/glibc (manylinux wheels), x86_64 and aarch64: the python:3.12-slim image
# and CI (setup-python 3.12). Not for Python 3.10/3.11 or macOS: numpy 2.4, pandas 3.0, scipy 1.17 and
# scikit-learn 1.8 need Python >= 3.11, and only Linux wheel hashes are listed.
#
# Install (Dockerfile, CI):
#   pip install --require-hashes --only-binary=:all: -r deploy/requirements.lock
#
# Versions = the research venv the package tests and golden parity were verified with (2026-10-02),
# except three security bumps to the first fixed release (OSV advisories against the venv versions;
# dependency sets unchanged):
#   anyio      4.13.0 -> 4.14.2  GHSA-82r6-8w77-94w6 (critical, TLS host-name encoding), GHSA-5p39-cfhj-2xmp
#   starlette  1.2.1  -> 1.3.1   GHSA-82w8-qh3p-5jfq (high, form-limit DoS), GHSA-jp82-jpqv-5vv3
#   urllib3    2.7.0  -> 2.8.0   GHSA-8988-9cw3-xx77, GHSA-vxq7-64xx-v4gw (high), GHSA-gh4c-6fx4-qh6g
# redis is not in the venv: optional L2 leg cache client (7.x line: 3 retries by default, 8.x: 10).
# numpy/pandas are pinned on purpose: golden outputs (sort ties, float reprs) are byte-identical only on a
# fixed numeric stack.
#
# Direct requirements: numpy pandas pyarrow requests scikit-learn fastapi uvicorn pydantic pydantic-settings
# redis. Regenerate with a hash-pinning resolver for CPython 3.12 Linux x86_64 + aarch64 (e.g. pip-compile
# --generate-hashes on Linux, or uv pip compile --universal --python-version 3.12 --generate-hashes), then
# run the package tests + golden/tools/parity_check.py on the new stack before shipping it.
# Checked 2026-10-02: every pin has cp312 manylinux x86_64 + aarch64 (or pure) wheels on PyPI, pip's resolver
# needs nothing beyond these 30 pins, and OSV lists no advisory for any of them.

