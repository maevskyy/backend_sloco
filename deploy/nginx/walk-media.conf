# Walk planner card photos (SLO-68), served read-only straight from disk.
# Included from the sloco.pp.ua HTTPS server{} block:
#   include /etc/nginx/snippets/walk-media.conf;
#
# A card's photo url = PHOTO_BASE_URL + "/" + key, with
# PHOTO_BASE_URL=https://sloco.pp.ua/walk-media (repo variable WALK_PHOTO_BASE_URL):
#   /walk-media/photos_cid/<cid>/<NN>_<label>.jpg
#   -> /opt/sloco-data/visual_photo_profiles/photos_cid/<cid>/<NN>_<label>.jpg
# The tree is synced by the research side; www-data needs o+x on the dirs and
# o+r on the files. Only that key shape is served; anything else is 404, no
# listings. Source: services/walk-planner/deploy/photos.nginx.conf.example.
location ^~ /walk-media/ {
    location ~ "^/walk-media/(photos_cid/[0-9]{1,20}/[0-9]{2}_[a-z]{1,16}\.jpg)$" {
        root /opt/sloco-data/visual_photo_profiles;
        try_files /$1 =404;
        limit_except GET { deny all; }
        types { image/jpeg jpg; }
        default_type image/jpeg;
        # Keys are stable but not content-addressed: a week, then revalidate
        # (ETag / Last-Modified). A 404 is never cached.
        add_header Cache-Control "public, max-age=604800, stale-while-revalidate=86400";
        add_header X-Content-Type-Options "nosniff" always;
        add_header Access-Control-Allow-Origin "*";
        sendfile on;
        tcp_nopush on;
        open_file_cache max=20000 inactive=10m;
        open_file_cache_valid 5m;
        open_file_cache_errors on;
        access_log /var/log/nginx/walk-media.access.log combined buffer=64k flush=5m;
    }
    return 404;
}
