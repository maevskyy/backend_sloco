name: CI

on:
  push:
  pull_request:

# One CI for the monorepo. A filter job detects which service changed; the Node
# and Python jobs run only when their folder (or this workflow) changed.
jobs:
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    outputs:
      gateway: ${{ steps.filter.outputs.gateway }}
      recommender: ${{ steps.filter.outputs.recommender }}
      dashboards: ${{ steps.filter.outputs.dashboards }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Filter paths
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            gateway:
              - 'services/gateway/**'
              - '.github/workflows/ci.yml'
            recommender:
              - 'services/recommendation/**'
              - '.github/workflows/ci.yml'
            dashboards:
              - 'services/gateway/grafana/dashboards/**'
              - '.github/workflows/ci.yml'

  gateway:
    name: Gateway (Node)
    needs: changes
    if: ${{ needs.changes.outputs.gateway == 'true' }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/gateway
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.11.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: services/gateway/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Build
        run: pnpm build

      - name: Test
        run: pnpm test

      - name: Lint
        run: pnpm lint

  recommender:
    name: Recommender (Python)
    needs: changes
    if: ${{ needs.changes.outputs.recommender == 'true' }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/recommendation
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Poetry
        run: pipx install poetry==2.1.3

      - name: Install dependencies
        run: poetry install --no-interaction --no-ansi

      - name: Check lock
        run: poetry check --lock

      - name: Lint
        run: poetry run ruff check .

      - name: Typecheck
        run: poetry run mypy src

      - name: Test
        run: poetry run pytest

  dashboards:
    name: Grafana dashboards (validate JSON)
    needs: changes
    if: ${{ needs.changes.outputs.dashboards == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Validate dashboard JSON
        run: |
          for f in services/gateway/grafana/dashboards/*.json; do
            node -e "JSON.parse(require('fs').readFileSync('$f','utf8')); console.log('ok $f')"
          done
