name: Deploy Production

# One deploy for the whole stack. Builds the selected service image(s), ships the
# compose + deploy configs to the server, renders /opt/backend_sloco/.env from
# secrets, and converges the stack. No manual scp, no hand-edited .env.

on:
  workflow_dispatch:
    inputs:
      service:
        description: "Which service(s) to build & deploy"
        required: true
        default: "all"
        type: choice
        options:
          - all
          - gateway
          - recommender
          - walk-planner
      ref:
        description: "Branch, tag, or commit SHA to deploy"
        required: true
        default: "main"
      # On = also bring up Grafana/Loki/Prometheus (needs GF_* secrets +
      # grafana.sloco.pp.ua). Off = normal app-only deploy.
      with_observability:
        description: "Redeploy metrics stack (Grafana/Loki/Prometheus)"
        required: false
        default: false
        type: boolean

permissions:
  contents: read
  packages: write

env:
  GATEWAY_IMAGE: ghcr.io/maevskyy/backend_sloco
  RECOMMENDER_IMAGE: ghcr.io/maevskyy/recommender_sloco
  WALK_PLANNER_IMAGE: ghcr.io/maevskyy/walk_planner_sloco

jobs:
  # Gate: run the same checks as CI on the exact ref being deployed, so a manual
  # deploy can never ship a ref that fails build/test/lint/typecheck.
  verify:
    name: Verify (checks on deployed ref)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout selected ref
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}

      # --- Gateway (Node) ---
      - name: Setup pnpm
        if: ${{ inputs.service == 'gateway' || inputs.service == 'all' }}
        uses: pnpm/action-setup@v4
        with:
          version: 10.11.0
      - name: Setup Node.js
        if: ${{ inputs.service == 'gateway' || inputs.service == 'all' }}
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: services/gateway/pnpm-lock.yaml
      - name: Gateway checks
        if: ${{ inputs.service == 'gateway' || inputs.service == 'all' }}
        working-directory: services/gateway
        run: |
          pnpm install --frozen-lockfile
          pnpm typecheck
          pnpm build
          pnpm test
          pnpm lint

      # --- Recommender (Python) ---
      - name: Setup Python
        if: ${{ inputs.service == 'recommender' || inputs.service == 'all' }}
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Poetry
        if: ${{ inputs.service == 'recommender' || inputs.service == 'all' }}
        run: pipx install poetry==2.1.3
      - name: Recommender checks
        if: ${{ inputs.service == 'recommender' || inputs.service == 'all' }}
        working-directory: services/recommendation
        run: |
          poetry install --no-interaction --no-ansi
          poetry check --lock
          poetry run ruff check .
          poetry run mypy src
          poetry run pytest

      # --- Walk planner (Python, vendored from the research repo) ---
      # Same checks as its own CI (services/walk-planner/deploy/ci): the
      # hash-pinned locks the image is built from, offline tests (real-data
      # tests skip), generated docs current.
      - name: Setup Python (walk-planner)
        if: ${{ inputs.service == 'walk-planner' || inputs.service == 'all' }}
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Walk planner checks
        if: ${{ inputs.service == 'walk-planner' || inputs.service == 'all' }}
        working-directory: services/walk-planner
        env:
          PYTHONDONTWRITEBYTECODE: "1"
          WALK_ROUTER_URL: ""
          ORS_API_KEY: ""
          WALK_ROUTE_CACHE_REDIS_URL: ""
        run: |
          python -m pip install --require-hashes --only-binary=:all: \
            -r deploy/requirements.lock -r deploy/requirements-test.lock
          python -m pip check
          python -m pytest -q
          python tools/export_openapi.py --check
          python tools/export_messages.py --check

  build:
    name: Build & push images
    needs: verify
    runs-on: ubuntu-latest
    outputs:
      short_sha: ${{ steps.sha.outputs.short_sha }}
    steps:
      - name: Checkout selected ref
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}

      - name: Resolve short SHA
        id: sha
        run: echo "short_sha=$(git rev-parse --short=12 HEAD)" >> "$GITHUB_OUTPUT"

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push gateway
        if: ${{ inputs.service == 'gateway' || inputs.service == 'all' }}
        uses: docker/build-push-action@v6
        with:
          context: ./services/gateway
          push: true
          tags: |
            ${{ env.GATEWAY_IMAGE }}:${{ steps.sha.outputs.short_sha }}
            ${{ env.GATEWAY_IMAGE }}:prod-latest

      - name: Build & push recommender
        if: ${{ inputs.service == 'recommender' || inputs.service == 'all' }}
        uses: docker/build-push-action@v6
        with:
          context: ./services/recommendation
          push: true
          tags: |
            ${{ env.RECOMMENDER_IMAGE }}:${{ steps.sha.outputs.short_sha }}
            ${{ env.RECOMMENDER_IMAGE }}:prod-latest

      # GIT_SHA labels the image and is echoed by GET /v1/meta.
      - name: Build & push walk-planner
        if: ${{ inputs.service == 'walk-planner' || inputs.service == 'all' }}
        uses: docker/build-push-action@v6
        with:
          context: ./services/walk-planner
          file: ./services/walk-planner/deploy/Dockerfile
          build-args: |
            GIT_SHA=${{ steps.sha.outputs.short_sha }}
          push: true
          tags: |
            ${{ env.WALK_PLANNER_IMAGE }}:${{ steps.sha.outputs.short_sha }}
            ${{ env.WALK_PLANNER_IMAGE }}:prod-latest

  deploy:
    name: Ship stack & converge
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout selected ref
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}

      # 1. Ship compose + deploy configs + grafana provisioning to the server,
      #    plus walk-planner's host scripts (OSRM dataset, bundle checks) and
      #    its golden acceptance data, which the image does not carry.
      - name: Sync stack files to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          source: "docker-compose.yml,deploy/**,observability/**,services/walk-planner/deploy/**,services/walk-planner/golden/scenarios.json,services/walk-planner/golden/expected/**"
          target: "/opt/backend_sloco"
          overwrite: true

      # 2. Render .env from secrets, then converge the whole stack.
      - name: Deploy on server
        uses: appleboy/ssh-action@v1.2.2
        env:
          SERVICE: ${{ inputs.service }}
          SHORT_SHA: ${{ needs.build.outputs.short_sha }}
          WITH_OBS: ${{ inputs.with_observability }}
          GATEWAY_IMAGE: ${{ env.GATEWAY_IMAGE }}
          RECOMMENDER_IMAGE: ${{ env.RECOMMENDER_IMAGE }}
          WALK_PLANNER_IMAGE: ${{ env.WALK_PLANNER_IMAGE }}
          GHCR_USERNAME: ${{ secrets.GHCR_USERNAME }}
          GHCR_READ_TOKEN: ${{ secrets.GHCR_READ_TOKEN }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          GF_SECURITY_ADMIN_USER: ${{ secrets.GF_SECURITY_ADMIN_USER }}
          GF_SECURITY_ADMIN_PASSWORD: ${{ secrets.GF_SECURITY_ADMIN_PASSWORD }}
          GF_SERVER_ROOT_URL: ${{ secrets.GF_SERVER_ROOT_URL }}
          # Repository Variable (not a secret): set to location_recommender_v4 to enable v4.
          RECOMMENDER_ALGORITHM: ${{ vars.RECOMMENDER_ALGORITHM }}
          # Walk planner switches are Repository Variables, so every later
          # deploy keeps them (SLO-68): WALK_PLANNER_ENABLED=true serves
          # /v1/walks/*; WALK_OSRM_ENABLED=true adds street routing (needs the
          # OSRM dataset on the host); WALK_BUNDLE_ID picks the data bundle;
          # WALK_PHOTO_BASE_URL makes card photo URLs absolute.
          WALK_PLANNER_ENABLED: ${{ vars.WALK_PLANNER_ENABLED }}
          WALK_OSRM_ENABLED: ${{ vars.WALK_OSRM_ENABLED }}
          WALK_BUNDLE_ID: ${{ vars.WALK_BUNDLE_ID }}
          WALK_PHOTO_BASE_URL: ${{ vars.WALK_PHOTO_BASE_URL }}
          ORS_API_KEY: ${{ secrets.ORS_API_KEY }}
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          envs: SERVICE,SHORT_SHA,WITH_OBS,GATEWAY_IMAGE,RECOMMENDER_IMAGE,WALK_PLANNER_IMAGE,GHCR_USERNAME,GHCR_READ_TOKEN,SUPABASE_URL,SUPABASE_SERVICE_ROLE_KEY,SUPABASE_DB_URL,GF_SECURITY_ADMIN_USER,GF_SECURITY_ADMIN_PASSWORD,GF_SERVER_ROOT_URL,RECOMMENDER_ALGORITHM,WALK_PLANNER_ENABLED,WALK_OSRM_ENABLED,WALK_BUNDLE_ID,WALK_PHOTO_BASE_URL,ORS_API_KEY
          script: |
            set -euo pipefail
            cd /opt/backend_sloco

            # Preserve current image tags for services we are NOT deploying.
            CUR_BACKEND="$(grep -E '^BACKEND_IMAGE=' .env 2>/dev/null | cut -d= -f2- || true)"
            CUR_REC="$(grep -E '^RECOMMENDATION_SERVICE_IMAGE=' .env 2>/dev/null | cut -d= -f2- || true)"
            CUR_WALK="$(grep -E '^WALK_PLANNER_IMAGE=' .env 2>/dev/null | cut -d= -f2- || true)"
            BACKEND_IMAGE_TAG="${CUR_BACKEND:-${GATEWAY_IMAGE}:prod-latest}"
            REC_IMAGE_TAG="${CUR_REC:-${RECOMMENDER_IMAGE}:prod-latest}"
            WALK_IMAGE_TAG="${CUR_WALK:-${WALK_PLANNER_IMAGE}:prod-latest}"

            if [ "$SERVICE" = "gateway" ] || [ "$SERVICE" = "all" ]; then
              BACKEND_IMAGE_TAG="${GATEWAY_IMAGE}:${SHORT_SHA}"
            fi
            if [ "$SERVICE" = "recommender" ] || [ "$SERVICE" = "all" ]; then
              REC_IMAGE_TAG="${RECOMMENDER_IMAGE}:${SHORT_SHA}"
            fi
            if [ "$SERVICE" = "walk-planner" ] || [ "$SERVICE" = "all" ]; then
              WALK_IMAGE_TAG="${WALK_PLANNER_IMAGE}:${SHORT_SHA}"
            fi

            # Render .env from secrets (single source of truth, idempotent).
            umask 077
            cat > .env <<EOF
            BACKEND_IMAGE=${BACKEND_IMAGE_TAG}
            RECOMMENDATION_SERVICE_IMAGE=${REC_IMAGE_TAG}
            WALK_PLANNER_IMAGE=${WALK_IMAGE_TAG}

            NODE_ENV=production
            SUPABASE_URL=${SUPABASE_URL}
            SUPABASE_SERVICE_ROLE_KEY=${SUPABASE_SERVICE_ROLE_KEY}
            SUPABASE_DB_URL=${SUPABASE_DB_URL}
            # Direct Postgres pool (SLO-32): every DB call goes through it. A wait
            # for a free client past 2 s or a query past 8 s (PostgREST's old
            # statement_timeout) answers 503 + Retry-After instead of hanging.
            PG_POOL_MAX=20
            PG_POOL_CONNECTION_TIMEOUT_MS=2000
            PG_POOL_IDLE_TIMEOUT_MS=30000
            PG_QUERY_TIMEOUT_MS=8000
            RECOMMENDATION_SERVICE_URL=http://recommendation-service:8000
            PLACE_CACHE_TTL_SECONDS=3600
            MAP_TILE_CACHE_TTL_SECONDS=604800
            # v2 = per-tile density cap (migration 017); bumping busts Redis keys,
            # the ETag and the client-facing ?v= from /v1/map/config together.
            # v3 = Berlin + sights/shopping/things_to_do landed in public.places
            # (58,427 rows). Tiles are built on demand and cached for 7 days, so
            # without this bump the map would keep serving pre-Berlin tiles.
            # v4 = z>=18 capped at 25 with no score floor (migration 029, SLO-47):
            # zooming z17 -> z18 no longer drops places. Apply 029 BEFORE deploying.
            MAP_TILE_VERSION=4

            RECOMMENDATION_APP_ENV=production
            RECOMMENDATION_LOG_LEVEL=info
            # uvicorn worker processes. recommend() is GIL-bound, so this is the
            # number of recommendations computed in parallel; each worker holds its
            # own copy of the artifacts (~2.6 GB) — 4 of 12 cores, ~10 GB of 64 (SLO-39).
            RECOMMENDATION_WORKERS=4

            REDIS_URL=redis://redis:6379/0

            # Host dir holding the large model artifacts, mounted read-only into the
            # recommender at /app/artifacts_external. Synced out of band (rsync); these
            # files are deliberately not in git and not baked into the image.
            ARTIFACTS_HOST_DIR=/opt/backend_sloco/artifacts_external
            EOF

            # Recommender v4 is opt-in via the RECOMMENDER_ALGORITHM repo Variable;
            # artifact paths are pinned together with the flag so the pair cannot drift.
            if [ "${RECOMMENDER_ALGORITHM:-}" = "location_recommender_v4" ]; then
              cat >> .env <<EOF

            RECOMMENDER_ALGORITHM=location_recommender_v4
            EMBEDDINGS_NPY_PATH=artifacts_external/location_embeddings_combined_all_themes.npy
            EMBEDDING_METADATA_PATH=artifacts_external/location_embeddings_combined_all_themes_metadata.csv
            EMBEDDING_RUN_ID=combined_all_themes
            LOCATIONS_CSV_PATH=artifacts_external/locations_combined_all_themes.csv
            RECOMMENDER_WEIGHTS_PRESET=text_direct
            # CSLS builds an NxN matrix over the whole candidate pool, and this request
            # path applies no city filter: ~85s/query on the 54k catalog against the
            # gateway's 5s timeout. Measured benefit here was ~1 suppressed hub per 120
            # recommendations, so it stays off. See sloco-recommender/CLAUDE.md.
            RECOMMENDER_HUBNESS_METHOD=none
            # The photo artifact baked into the image covers Bucharest + Tbilisi only
            # (17,936 places, 0% Berlin). With weight 0.50 on the photo channel and
            # missing_direct_image_policy=redistribute, that silently drops Berlin out of
            # cross-city results. The external artifact is the full run: 81,967 places,
            # Berlin 96.6% / Bucharest 96.5% / Tbilisi 82.2%.
            DIRECT_IMAGE_EMBEDDINGS_NPY_PATH=artifacts_external/direct_place_image_embeddings_openclip_vitb32_v1.npy
            DIRECT_IMAGE_METADATA_PATH=artifacts_external/direct_place_image_embeddings_openclip_vitb32_v1_metadata.parquet
            EOF
            fi

            # Walk planner (SLO-68): off unless the WALK_PLANNER_ENABLED repo
            # Variable is "true". Off = the gateway answers /v1/walks/* with 503
            # walk_planner_unavailable and the containers are removed below.
            PROFILE=""
            if [ "${WALK_PLANNER_ENABLED:-}" = "true" ]; then
              PROFILE="$PROFILE --profile walk-planner"
              cat >> .env <<EOF

            WALK_PLANNER_URL=http://walk-planner:8000
            # Immutable bundle dirs synced out of band (sync_bundle.sh), mounted read-only.
            WALK_BUNDLES_HOST_DIR=/opt/sloco-data/walk/bundles
            WALK_BUNDLE_ID=${WALK_BUNDLE_ID:-bucharest-20261002-d68a311e}
            WALK_PLANNER_WORKERS=2
            # = WALK_PLANNER_WORKERS x the service's WALK_MAX_CONCURRENT_PLANS (2).
            WALK_PLANNER_MAX_CONCURRENT=4
            PHOTO_BASE_URL=${WALK_PHOTO_BASE_URL:-}
            ORS_API_KEY=${ORS_API_KEY:-}
            EOF
              if [ "${WALK_OSRM_ENABLED:-}" = "true" ]; then
                PROFILE="$PROFILE --profile walk-osrm"
                cat >> .env <<EOF
            WALK_ROUTER_URL=http://osrm-foot:5000
            OSRM_HOST_DIR=/opt/osrm
            EOF
              fi
            fi

            # Observability (Grafana/Loki/Prometheus) is opt-in via with_observability.
            if [ "$WITH_OBS" = "true" ]; then
              cat >> .env <<EOF

            GF_SECURITY_ADMIN_USER=${GF_SECURITY_ADMIN_USER}
            GF_SECURITY_ADMIN_PASSWORD=${GF_SECURITY_ADMIN_PASSWORD}
            GF_SERVER_ROOT_URL=${GF_SERVER_ROOT_URL}
            EOF
            fi

            # Authenticate to GHCR for image pulls. The packages are PUBLIC, so a pull
            # works without credentials; the login only helps against rate limits and
            # would be required if a package ever turns private. An expired
            # GHCR_READ_TOKEN must therefore NOT abort the deploy (it did on
            # 2026-08-28: `docker login` answered `denied: denied` and set -e killed the
            # whole script even though the images were public and already pushed).
            # A real access problem still fails loudly one line below, on `pull`.
            if [ -n "${GHCR_USERNAME:-}" ] && [ -n "${GHCR_READ_TOKEN:-}" ]; then
              if ! echo "$GHCR_READ_TOKEN" | docker login ghcr.io -u "$GHCR_USERNAME" --password-stdin; then
                echo "WARNING: GHCR login failed (expired GHCR_READ_TOKEN?) — continuing with anonymous pulls."
              fi
            else
              echo "WARNING: GHCR_USERNAME / GHCR_READ_TOKEN not set — pulling anonymously."
            fi

            # Converge. Observability profile only when explicitly requested.
            if [ "$WITH_OBS" = "true" ]; then
              PROFILE="$PROFILE --profile observability"
            fi
            docker compose $PROFILE pull
            docker compose $PROFILE up -d
            # A switched-off walk planner / OSRM must not keep running from an
            # earlier deploy (`up` leaves services of inactive profiles alone).
            if [ "${WALK_PLANNER_ENABLED:-}" != "true" ]; then
              docker compose --profile walk-planner --profile walk-osrm rm -sf walk-planner osrm-foot || true
            elif [ "${WALK_OSRM_ENABLED:-}" != "true" ]; then
              docker compose --profile walk-osrm rm -sf osrm-foot || true
            fi
            docker image prune -f

            # Health gate on the walk planner, seen from the gateway container
            # (same network path as real calls). Ready ~5–6 s after start.
            if [ "${WALK_PLANNER_ENABLED:-}" = "true" ]; then
              walk_ready=0
              for attempt in $(seq 1 24); do
                if docker compose exec -T backend node -e "fetch('http://walk-planner:8000/v1/health/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"; then
                  walk_ready=1
                  break
                fi
                echo "walk-planner not ready yet. Attempt ${attempt}/24"
                sleep 5
              done
              if [ "$walk_ready" != "1" ]; then
                docker compose --profile walk-planner ps
                docker compose --profile walk-planner logs --tail=100 walk-planner
                exit 1
              fi
            fi

            # Health gate on the gateway.
            for attempt in $(seq 1 12); do
              if curl --fail --silent --show-error http://127.0.0.1:3000/v1/health; then
                exit 0
              fi
              echo "Backend not healthy yet. Attempt ${attempt}/12"
              sleep 5
            done

            docker compose ps
            docker compose logs --tail=100 backend
            exit 1

      - name: Public healthcheck
        run: |
          for attempt in $(seq 1 12); do
            if curl --fail --silent --show-error "${{ secrets.PRODUCTION_API_URL }}/v1/health"; then
              exit 0
            fi
            echo "Production API not healthy yet. Attempt ${attempt}/12"
            sleep 5
          done
          curl --verbose "${{ secrets.PRODUCTION_API_URL }}/v1/health"
          exit 1
