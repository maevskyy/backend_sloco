# CI of the walk-planner package (services/walk_planner):
#   tests  : the package test suite on the production stack (CPython 3.12 + the hash-pinned
#            deploy/requirements.lock), on Linux (glibc): golden JSON made on macOS is compared with the golden
#            comparator (numbers within 1e-6). No real data: tests that need the local Bucharest data skip.
#            Plus: docs/openapi.json and docs/messages.json are current.
#   image  : builds the service image (no push) and smoke-tests it like compose runs it: read-only root FS,
#            no capabilities, the committed mini bundle mounted read-only, until GET /v1/health/ready is 200;
#            refuses a corrupted bundle with exit 78 (also with 2 workers); replays the mini golden calls against
#            the running container (python -m walk_planner golden run --url).
# No secrets are used. Nothing is pushed or deployed (the dashboard deploy is .github/workflows/deploy.yml).

name: walk-planner-ci

on:
  push:
    branches: [main]
    paths:
      - "services/walk_planner/**"
      - ".github/workflows/walk-planner-ci.yml"
  pull_request:
    paths:
      - "services/walk_planner/**"
      - ".github/workflows/walk-planner-ci.yml"
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: walk-planner-ci-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash
    working-directory: services/walk_planner

jobs:
  tests:
    name: tests (py3.12, pinned deps)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            services/walk_planner/deploy/requirements.lock
            services/walk_planner/deploy/requirements-test.lock

      - name: Install pinned runtime + test dependencies (hash-checked, wheels only)
        run: |
          python -m pip install --require-hashes --only-binary=:all: \
            -r deploy/requirements.lock -r deploy/requirements-test.lock
          python -m pip check

      - name: Package tests (offline; real-data tests skip)
        env:
          PYTHONDONTWRITEBYTECODE: "1"
          # The suite must never need these; empty values keep any stray routing code fully offline.
          WALK_ROUTER_URL: ""
          ORS_API_KEY: ""
          WALK_ROUTE_CACHE_REDIS_URL: ""
        run: python -m pytest -q -rs

      - name: Generated docs are current (OpenAPI, message catalog)
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          python tools/export_openapi.py --check
          python tools/export_messages.py --check

  image:
    name: service image (build + smoke, no push)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - name: Build (context = services/walk_planner)
        run: |
          docker build -f deploy/Dockerfile --build-arg GIT_SHA="${GITHUB_SHA::12}" -t sloco-walk-planner:ci .
          docker image ls sloco-walk-planner:ci

      - name: Smoke - service module imports, non-root user
        run: |
          docker run --rm sloco-walk-planner:ci python -c "import walk_planner, walk_planner.service.app as app; assert callable(app.create_app); print('walk_planner', walk_planner.__version__)"
          test "$(docker inspect -f '{{.Config.User}}' sloco-walk-planner:ci)" = "10001:10001"

      - name: Smoke - refuses to start without a bundle or with a corrupted one (exit 78, also with 2 workers)
        run: |
          rc=0
          docker run --rm -e WALK_BUNDLE_DIR=/nonexistent sloco-walk-planner:ci || rc=$?
          test "$rc" -eq 78
          bad="$RUNNER_TEMP/corrupt-bundles"
          rm -rf "$bad" && mkdir -p "$bad" && cp -R tests/fixtures/mini/bundles/. "$bad/"
          f=$(ls "$bad"/*/interest/has_image.npy | head -n 1)
          python3 -c "import sys; p = sys.argv[1]; b = bytearray(open(p, 'rb').read()); b[-1] ^= 0xFF; open(p, 'wb').write(bytes(b))" "$f"
          chmod -R a+rX "$bad"
          rc=0
          docker run --rm --read-only --tmpfs /tmp:size=64m --cap-drop ALL --security-opt no-new-privileges \
            -v "$bad:/bundles:ro" -e WALK_BUNDLE_DIR=/bundles -e WEB_CONCURRENCY=2 sloco-walk-planner:ci || rc=$?
          test "$rc" -eq 78

      - name: Smoke - serves the committed mini bundle (hardened like compose)
        run: |
          manifest=$(ls tests/fixtures/mini/bundles/*/manifest.json 2>/dev/null | head -n 1 || true)
          if [ -z "$manifest" ]; then echo "no committed mini bundle: skipped"; exit 0; fi
          bundle_id=$(basename "$(dirname "$manifest")")
          docker run -d --name walk-planner-ci -p 127.0.0.1:18600:8000 \
            --read-only --tmpfs /tmp:size=64m --cap-drop ALL --security-opt no-new-privileges \
            -v "$PWD/tests/fixtures/mini/bundles:/bundles:ro" \
            -e WALK_BUNDLE_DIR="/bundles/$bundle_id" -e WEB_CONCURRENCY=2 -e ENVIRONMENT=ci \
            sloco-walk-planner:ci
          ok=0
          for _ in $(seq 1 45); do
            if curl -fsS http://127.0.0.1:18600/v1/health/ready; then ok=1; break; fi
            sleep 2
          done
          echo
          docker logs walk-planner-ci 2>&1 | tail -n 60
          test "$ok" -eq 1
          curl -fsS http://127.0.0.1:18600/v1/meta
          echo

      - name: Acceptance - replay the mini golden API calls against the running container
        run: |
          docker run --rm --network host -v "$PWD/tests/fixtures/mini:/mini:ro" sloco-walk-planner:ci \
            python -m walk_planner golden run --url http://127.0.0.1:18600 \
              --scenarios /mini/scenarios.json --expected-root /mini/expected --wait 30

      - name: Remove the smoke container
        if: always()
        run: docker rm -f walk-planner-ci >/dev/null 2>&1 || true
