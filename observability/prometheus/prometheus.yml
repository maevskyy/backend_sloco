global:
  # 5s during load tests so latency/throughput spikes are not smoothed away.
  scrape_interval: 5s
  evaluation_interval: 15s

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["127.0.0.1:9090"]

  # Gateway app metrics (RED histograms, Node runtime, dependency/cache).
  # Reachable only on the private network — /metrics is not under /v1, Nginx won't expose it.
  - job_name: gateway
    metrics_path: /metrics
    static_configs:
      - targets: ["backend:3000"]

  # Redis internals: memory vs maxmemory, evictions, ops, hit/miss, clients.
  - job_name: redis
    static_configs:
      - targets: ["redis_exporter:9121"]

  # Per-container CPU/RAM/throttling.
  - job_name: cadvisor
    static_configs:
      - targets: ["cadvisor:8080"]

  # Host CPU/RAM/net/disk.
  - job_name: node
    static_configs:
      - targets: ["node_exporter:9100"]

  # Supabase managed Postgres metrics (connections / CPU / disk).
  # Optional — enable on a plan that exposes the privileged metrics endpoint.
  # Fill <project-ref>; put the service-role key in the password.
  # - job_name: supabase
  #   scheme: https
  #   metrics_path: /customer/v1/privileged/metrics
  #   basic_auth:
  #     username: service_role
  #     password: "${SUPABASE_SERVICE_ROLE_KEY}"
  #   static_configs:
  #     - targets: ["<project-ref>.supabase.co"]
