apiVersion: 1

providers:
  - name: sloco
    orgId: 1
    type: file
    disableDeletion: false
    allowUiUpdates: true
    updateIntervalSeconds: 30
    options:
      path: /var/lib/grafana/dashboards
      # subfolders on disk (app/, infra/) become Grafana folders
      foldersFromFilesStructure: true
